# Terraform CI/CD for the AKS platform.
# fmt and validate need no credentials. plan reads Azure. apply is gated behind
# an approval on the matching Azure DevOps environment.

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  TF_VERSION: 1.15.5
  SERVICE_CONNECTION: azure-sub-connection
  # Stops Terraform printing "next step" suggestions meant for humans.
  TF_IN_AUTOMATION: 'true'

stages:
  - stage: validate
    displayName: Validate
    jobs:
      - job: fmt_and_validate
        displayName: fmt and validate
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform $(TF_VERSION)
            inputs:
              terraformVersion: $(TF_VERSION)

          # Fails the build on unformatted code before anything slower runs.
          - script: terraform fmt -check -recursive
            displayName: terraform fmt -check

          # -backend=false because validate only needs provider schemas,
          # not the remote state, so this step needs no Azure credentials.
          - script: |
              set -e
              for env in dev staging; do
                echo "----- $env -----"
                terraform -chdir=environments/$env init -backend=false -input=false
                terraform -chdir=environments/$env validate
              done
            displayName: terraform validate

  - stage: plan
    displayName: Plan
    dependsOn: validate
    jobs:
      - job: plan_dev
        displayName: plan dev
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform $(TF_VERSION)
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: terraform plan (dev)
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              # Exposes the federated identity to the script as $idToken etc.
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_TENANT_ID="$tenantId"
                # Backticks, not $(), because Azure DevOps would try to expand $().
                export ARM_SUBSCRIPTION_ID=`az account show --query id --output tsv`

                cd environments/dev
                terraform init -input=false
                terraform plan -input=false -lock-timeout=5m

      - job: plan_staging
        displayName: plan staging
        steps:
          - task: TerraformInstaller@1
            displayName: Install Terraform $(TF_VERSION)
            inputs:
              terraformVersion: $(TF_VERSION)

          - task: AzureCLI@2
            displayName: terraform plan (staging)
            inputs:
              azureSubscription: $(SERVICE_CONNECTION)
              scriptType: bash
              scriptLocation: inlineScript
              addSpnToEnvironment: true
              inlineScript: |
                set -e
                export ARM_USE_OIDC=true
                export ARM_CLIENT_ID="$servicePrincipalId"
                export ARM_OIDC_TOKEN="$idToken"
                export ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID=`az account show --query id --output tsv`

                cd environments/staging
                terraform init -input=false
                terraform plan -input=false -lock-timeout=5m

  # deployment jobs bind to an Azure DevOps environment, which is what makes the
  # approval check fire. They also do not clone the repo unless told to.
  - stage: apply_dev
    displayName: Apply dev
    dependsOn: plan
    jobs:
      - deployment: apply_dev
        displayName: apply dev
        environment: dev
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform $(TF_VERSION)
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - task: AzureCLI@2
                  displayName: terraform apply (dev)
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -e
                      export ARM_USE_OIDC=true
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID=`az account show --query id --output tsv`

                      cd environments/dev
                      terraform init -input=false
                      terraform apply -auto-approve -input=false -lock-timeout=5m

  # Staging only runs after dev succeeded, so a broken change cannot reach it.
  - stage: apply_staging
    displayName: Apply staging
    dependsOn: apply_dev
    jobs:
      - deployment: apply_staging
        displayName: apply staging
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: TerraformInstaller@1
                  displayName: Install Terraform $(TF_VERSION)
                  inputs:
                    terraformVersion: $(TF_VERSION)

                - task: AzureCLI@2
                  displayName: terraform apply (staging)
                  inputs:
                    azureSubscription: $(SERVICE_CONNECTION)
                    scriptType: bash
                    scriptLocation: inlineScript
                    addSpnToEnvironment: true
                    inlineScript: |
                      set -e
                      export ARM_USE_OIDC=true
                      export ARM_CLIENT_ID="$servicePrincipalId"
                      export ARM_OIDC_TOKEN="$idToken"
                      export ARM_TENANT_ID="$tenantId"
                      export ARM_SUBSCRIPTION_ID=`az account show --query id --output tsv`

                      cd environments/staging
                      terraform init -input=false
                      terraform apply -auto-approve -input=false -lock-timeout=5m
